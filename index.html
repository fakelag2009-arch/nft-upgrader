﻿<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <title>NFT Upgrader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="#229ED9"/>
        <path d="M17 8l-2 9-3-3-2 2-1-5-3-1 11-3z" fill="white"/>
      </svg>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-right">
      <div class="avatar">
        <img id="userAvatar" src="" alt="av" style="display:none"/>
        <div id="userInitials" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(135deg,#1a6fff,#aa00ff)"></div>
      </div>
      <div class="topbar-info">
        <div class="topbar-balance" id="userBalance">0 &#11088;</div>
        <button class="topup-btn" onclick="showTopup()">+ &#1055;&#1086;&#1087;&#1086;&#1083;&#1085;&#1080;&#1090;&#1100;</button>
      </div>
    </div>
  </header>

  <main class="pages">

    <!-- HOME -->
    <section class="page active" id="page-home">
      <div class="home-menu">
        <div class="home-menu-title">NFT Upgrader</div>
        <button class="hm-btn hm-upgrade" onclick="switchPage('upgrade')">
          <div class="hm-left">
            <div class="hm-title">&#1040;&#1055;&#1043;&#1056;&#1045;&#1049;&#1044;</div>
            <div class="hm-sub">&#1050;&#1088;&#1091;&#1090;&#1080; &#1082;&#1086;&#1083;&#1100;&#1094;&#1086; &mdash; &#1084;&#1077;&#1085;&#1103;&#1081; &#1087;&#1086;&#1076;&#1072;&#1088;&#1086;&#1082; &#1085;&#1072; &#1076;&#1086;&#1088;&#1086;&#1078;&#1077;</div>
            <div class="hm-tag hm-tag-green">&#1064;&#1040;&#1053;&#1057; &#1044;&#1054; 80%</div>
          </div>
          <div class="hm-right hm-wheel">
            <svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="28" fill="#0a2210" stroke="#00e676" stroke-width="1.5" opacity="0.6"/><path d="M32 32L32 6A26 26 0 0 1 55 45Z" fill="#0e3018" stroke="#00e676" stroke-width="1" opacity="0.7"/><path d="M32 32L55 45A26 26 0 1 1 32 6Z" fill="#2a0f10" stroke="#ff4757" stroke-width="1" opacity="0.5"/><polygon points="32,4 29,12 35,12" fill="#fff"/></svg>
          </div>
        </button>
        <button class="hm-btn hm-inventory" onclick="switchPage('inventory')">
          <div class="hm-left">
            <div class="hm-title">&#1048;&#1053;&#1042;&#1045;&#1053;&#1058;&#1040;&#1056;&#1068;</div>
            <div class="hm-sub">&#1058;&#1074;&#1086;&#1080; &#1087;&#1088;&#1077;&#1076;&#1084;&#1077;&#1090;&#1099; &#1080; &#1087;&#1086;&#1076;&#1072;&#1088;&#1082;&#1080;</div>
          </div>
          <div class="hm-right">
            <svg viewBox="0 0 72 60" width="72" height="60"><rect x="8" y="26" width="56" height="30" rx="5" fill="#6b3a1f" stroke="#ffd700" stroke-width="1.5"/><rect x="8" y="18" width="56" height="14" rx="5" fill="#8b4513" stroke="#ffd700" stroke-width="1.5"/><rect x="34" y="18" width="4" height="38" fill="#ffd700" opacity="0.35"/><rect x="24" y="32" width="24" height="14" rx="3" fill="#ffd700"/><circle cx="36" cy="39" r="4" fill="#6b3a1f"/><circle cx="16" cy="10" r="3" fill="#ffd700" opacity="0.7"/><circle cx="56" cy="9" r="2.5" fill="#ffd700" opacity="0.6"/></svg>
          </div>
        </button>
        <button class="hm-btn hm-promo" onclick="showPromo()">
          <div class="hm-left">
            <div class="hm-title">&#1055;&#1056;&#1054;&#1052;&#1054;&#1050;&#1054;&#1044;</div>
            <div class="hm-sub">&#1040;&#1082;&#1090;&#1080;&#1074;&#1080;&#1088;&#1091;&#1081; &#1082;&#1086;&#1076; &#1080; &#1087;&#1086;&#1083;&#1091;&#1095;&#1080; Stars</div>
          </div>
          <div class="hm-right">
            <svg viewBox="0 0 72 48" width="72" height="48"><rect x="4" y="8" width="64" height="32" rx="7" fill="#2a0050" stroke="#aa00ff" stroke-width="1.5"/><circle cx="4" cy="24" r="7" fill="#07070f"/><circle cx="68" cy="24" r="7" fill="#07070f"/><line x1="18" y1="24" x2="54" y2="24" stroke="#aa00ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/><rect x="8" y="12" width="20" height="24" rx="4" fill="#3a0070"/><text x="18" y="29" font-size="14" text-anchor="middle" fill="#ffd700">&#11088;</text><text x="46" y="21" font-size="9" fill="#cc44ff" font-weight="700" text-anchor="middle">500</text><text x="46" y="33" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle">STARS</text><circle cx="62" cy="4" r="3" fill="#ffd700" opacity="0.8"/></svg>
          </div>
        </button>
        <button class="hm-btn hm-cases" onclick="showToast('&#9203; &#1057;&#1082;&#1086;&#1088;&#1086;...', '#ffd700')">
          <div class="hm-left">
            <div class="hm-title">&#1050;&#1045;&#1049;&#1057;&#1067;</div>
            <div class="hm-sub">&#1054;&#1090;&#1082;&#1088;&#1099;&#1074;&#1072;&#1081; &#1082;&#1077;&#1081;&#1089;&#1099; &#1080; &#1087;&#1086;&#1083;&#1091;&#1095;&#1072;&#1081; &#1087;&#1088;&#1080;&#1079;&#1099;</div>
            <div class="hm-tag hm-tag-gold">&#1057;&#1050;&#1054;&#1056;&#1054;</div>
          </div>
          <div class="hm-right">
            <svg viewBox="0 0 72 60" width="72" height="60"><rect x="8" y="26" width="56" height="30" rx="6" fill="#1a1a2e" stroke="#ffd700" stroke-width="1.5"/><rect x="8" y="15" width="56" height="16" rx="6" fill="#1a1a2e" stroke="#ffd700" stroke-width="1.5"/><rect x="34" y="15" width="4" height="41" fill="#ffd700" opacity="0.3"/><rect x="24" y="33" width="24" height="14" rx="3" fill="#ffd700"/><circle cx="36" cy="40" r="4" fill="#1a1a2e"/><circle cx="14" cy="8" r="3" fill="#ffd700" opacity="0.8"/><path d="M32 8L33.5 3L36 8L41 9.5L36 11L33.5 16L32 11L27 9.5Z" fill="#ffd700" opacity="0.9"/></svg>
          </div>
        </button>
      </div>
    </section>

    <!-- CASE OPEN OVERLAY -->
    <div class="case-open-overlay" id="caseOpenOverlay">
      <div class="case-open-box">
        <div class="case-open-title" id="caseOpenTitle">&#1054;&#1090;&#1082;&#1088;&#1099;&#1074;&#1072;&#1077;&#1084;...</div>
        <div class="case-reel-wrap">
          <div class="case-reel-arrow"></div>
          <div class="case-reel-container">
            <div class="case-reel" id="caseReel"></div>
          </div>
        </div>
        <div class="case-open-result" id="caseOpenResult" style="display:none">
          <div class="case-result-glow" id="caseResultGlow"></div>
          <img class="case-result-img" id="caseResultImg" src="" alt=""/>
          <div class="case-result-name" id="caseResultName"></div>
          <div class="case-result-val" id="caseResultVal"></div>
          <button class="case-result-btn" onclick="closeCaseOpen()">&#1054;&#1090;&#1083;&#1080;&#1095;&#1085;&#1086;!</button>
        </div>
      </div>
    </div>

    <!-- UPGRADE PAGE -->
    <section class="page" id="page-upgrade">
      <div class="page-title"><span class="title-icon">&#8679;</span> UPGRADE</div>
      <div class="feed-scroll"><div class="feed-track" id="feedTrack"></div></div>
      <div class="roulette-arena">
        <div class="roulette-outer">
          <div class="roulette-ring" id="rouletteRing">
            <canvas id="rouletteCanvas" width="280" height="280"></canvas>
            <div class="roulette-center">
              <span id="centerText">&#1042;&#1099;&#1073;&#1077;&#1088;&#1080;&#1090;&#1077; &#1087;&#1088;&#1077;&#1076;&#1084;&#1077;&#1090;</span>
              <span id="centerPercent" class="center-percent"></span>
            </div>
            <div class="roulette-needle"></div>
          </div>
        </div>
      </div>
      <div class="slots-row">
        <div class="slot" id="slotYours" onclick="openItemModal('yours')">
          <div class="slot-label">&#1042;&#1072;&#1096; &#1087;&#1088;&#1077;&#1076;&#1084;&#1077;&#1090;</div>
          <div class="slot-arrow">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M7 8L12 13L17 8" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M7 13L12 18L17 13" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div class="slot" id="slotWanted" onclick="openItemModal('wanted')">
          <div class="slot-label">&#1046;&#1077;&#1083;&#1072;&#1077;&#1084;&#1099;&#1081; &#1087;&#1088;&#1077;&#1076;&#1084;&#1077;&#1090;</div>
          <div class="slot-arrow">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M7 16L12 11L17 16" stroke="#4d9fff" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M7 11L12 6L17 11" stroke="#1a5faa" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="action-bar">
        <button class="action-icon-btn" onclick="resetSlots()">&#8635;</button>
        <button class="upgrade-btn" id="upgradeBtn" onclick="startUpgrade()" disabled>
          <span class="upgrade-btn-text">&#8679; &#1040;&#1087;&#1075;&#1088;&#1077;&#1081;&#1076;</span>
          <span class="upgrade-btn-sub" id="upgradeBtnSub">&#1064;&#1072;&#1085;&#1089; &#1074;&#1099;&#1080;&#1075;&#1088;&#1099;&#1096;&#1072; 0%</span>
        </button>
      </div>
      <div class="inner-tabs">
        <button class="inner-tab active" id="itab-inventory" onclick="switchInnerTab('inventory')">&#1048;&#1085;&#1074;&#1077;&#1085;&#1090;&#1072;&#1088;&#1100; <span id="invBadge" style="display:none;background:#00e676;color:#000;border-radius:50%;width:16px;height:16px;font-size:10px;font-weight:700;align-items:center;justify-content:center;margin-left:4px"></span></button>
        <button class="inner-tab" id="itab-shop" onclick="switchInnerTab('shop')">&#1052;&#1072;&#1075;&#1072;&#1079;&#1080;&#1085;</button>
      </div>
      <div class="inner-panel active" id="ipanel-inventory">
        <div class="inv-empty" id="invEmpty">
          <div style="font-size:40px">&#128230;</div>
          <p>&#1048;&#1085;&#1074;&#1077;&#1085;&#1090;&#1072;&#1088;&#1100; &#1087;&#1091;&#1089;&#1090;</p>
          <button class="inv-go-shop" onclick="switchInnerTab('shop')">&#1042; &#1084;&#1072;&#1075;&#1072;&#1079;&#1080;&#1085;</button>
        </div>
        <div class="inv-grid" id="invGrid" style="display:none"></div>
      </div>
      <div class="inner-panel" id="ipanel-shop">
        <div class="shop-tabs">
          <button class="shop-tab active" onclick="setShopTab('all',this)">&#1042;&#1089;&#1077;</button>
          <button class="shop-tab" onclick="setShopTab('common',this)">&#1054;&#1073;&#1099;&#1095;&#1085;&#1099;&#1077;</button>
          <button class="shop-tab" onclick="setShopTab('uncommon',this)">&#1053;&#1077;&#1086;&#1073;&#1099;&#1095;&#1085;&#1099;&#1077;</button>
          <button class="shop-tab" onclick="setShopTab('rare',this)">&#1056;&#1077;&#1076;&#1082;&#1080;&#1077;</button>
          <button class="shop-tab" onclick="setShopTab('legendary',this)">&#1051;&#1077;&#1075;&#1077;&#1085;&#1076;.</button>
        </div>
        <div class="shop-grid" id="shopGrid"></div>
      </div>
      <div style="height:20px;flex-shrink:0"></div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="switchPage('home')">
      <div class="nav-active-pill"></div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M3 9.5L12 3L21 9.5V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V9.5Z" fill="currentColor" opacity="0.9"/>
        <path d="M9 21V15H15V21" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="nav-label">&#1043;&#1083;&#1072;&#1074;&#1085;&#1072;&#1103;</span>
    </button>
  </nav>

</div>

<!-- TOPUP MODAL -->
<div class="modal-overlay" id="topupModal" onclick="closeTopupOutside(event)">
  <div class="modal topup-modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span>&#1055;&#1086;&#1087;&#1086;&#1083;&#1085;&#1080;&#1090;&#1100; &#1073;&#1072;&#1083;&#1072;&#1085;&#1089;</span>
      <button class="modal-close" onclick="closeTopup()">&#10005;</button>
    </div>
    <div class="topup-body">
      <div class="topup-star-display">
        <div class="topup-star-emoji">&#11088;</div>
        <div class="topup-star-amount" id="topupDisplay">100</div>
        <div class="topup-star-sub">Stars</div>
      </div>
      <div class="topup-chips">
        <button class="topup-chip" onclick="setAmt(15)">15</button>
        <button class="topup-chip" onclick="setAmt(50)">50</button>
        <button class="topup-chip" onclick="setAmt(100)">100</button>
        <button class="topup-chip active" onclick="setAmt(250)">250</button>
        <button class="topup-chip" onclick="setAmt(500)">500</button>
        <button class="topup-chip" onclick="setAmt(1000)">1000</button>
      </div>
      <div class="topup-input-row">
        <span class="topup-input-star">&#11088;</span>
        <input type="number" id="topupInput" min="1" max="999999" value="250" placeholder="&#1050;&#1086;&#1083;&#1080;&#1095;&#1077;&#1089;&#1090;&#1074;&#1086;" oninput="onTopupInput(this.value)"/>
      </div>
      <button class="topup-pay-btn" onclick="confirmTopup()">&#1054;&#1087;&#1083;&#1072;&#1090;&#1080;&#1090;&#1100; <span id="topupPayLabel">250 &#11088;</span></button>
      <div class="topup-footer">&#1054;&#1087;&#1083;&#1072;&#1090;&#1072; &#1095;&#1077;&#1088;&#1077;&#1079; Telegram Stars &middot; &#1047;&#1072;&#1095;&#1080;&#1089;&#1083;&#1103;&#1077;&#1090;&#1089;&#1103; &#1085;&#1072; &#1073;&#1072;&#1083;&#1072;&#1085;&#1089; &#1073;&#1086;&#1090;&#1072;</div>
    </div>
  </div>
</div>

<!-- ITEM MODAL -->
<div class="modal-overlay" id="itemModal" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span id="modalTitle">&#1042;&#1099;&#1073;&#1077;&#1088;&#1080;&#1090;&#1077; &#1087;&#1088;&#1077;&#1076;&#1084;&#1077;&#1090;</span>
      <button class="modal-close" onclick="closeItemModal()">&#10005;</button>
    </div>
    <div class="modal-search">
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="&#1055;&#1086;&#1080;&#1089;&#1082;..." oninput="filterItems()" autocomplete="off"/>
      </div>
    </div>
    <div class="rarity-tabs">
      <button class="rtab active" onclick="setRarityFilter('all',this)">&#1042;&#1089;&#1077;</button>
      <button class="rtab" onclick="setRarityFilter('common',this)">&#1054;&#1073;&#1099;&#1095;&#1085;&#1099;&#1077;</button>
      <button class="rtab" onclick="setRarityFilter('uncommon',this)">&#1053;&#1077;&#1086;&#1073;&#1099;&#1095;&#1085;&#1099;&#1077;</button>
      <button class="rtab" onclick="setRarityFilter('rare',this)">&#1056;&#1077;&#1076;&#1082;&#1080;&#1077;</button>
      <button class="rtab" onclick="setRarityFilter('legendary',this)">&#1051;&#1077;&#1075;&#1077;&#1085;&#1076;.</button>
    </div>
    <div class="modal-grid" id="itemGrid"></div>
  </div>
</div>

<!-- BUY MODAL -->
<div class="modal-overlay" id="buyModal" onclick="closeBuyModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span>&#1050;&#1091;&#1087;&#1080;&#1090;&#1100; &#1087;&#1088;&#1077;&#1076;&#1084;&#1077;&#1090;</span>
      <button class="modal-close" onclick="closeBuyModal()">&#10005;</button>
    </div>
    <div class="buy-modal-body" id="buyModalBody"></div>
  </div>
</div>

<!-- RESULT -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-box">
    <div class="result-particles" id="resultParticles"></div>
    <div class="result-glow" id="resultGlow"></div>
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="result-item-card" id="resultItemCard"></div>
    <div class="result-actions">
      <button class="result-btn-secondary" onclick="closeResult()">&#1047;&#1072;&#1082;&#1088;&#1099;&#1090;&#1100;</button>
      <button class="result-btn-primary" onclick="closeResult()">&#1045;&#1097;&#1105; &#1088;&#1072;&#1079;</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

<!-- PROMO MODAL -->
<div id="promoModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);z-index:2000;align-items:flex-end;justify-content:center" onclick="if(event.target===this)closePromo()">
  <div style="position:relative;width:100%;max-width:480px;background:#0d0d1f;border-radius:28px 28px 0 0;padding:0 24px 40px;border-top:1px solid rgba(170,0,255,0.3);transform:translateY(100%);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 -4px 40px rgba(170,0,255,0.2)" id="promoSheet">
    <div id="promoParticles" style="position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden"></div>
    <div style="width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:14px auto 24px"></div>
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:52px;line-height:1;margin-bottom:12px;display:inline-block;filter:drop-shadow(0 0 16px rgba(170,0,255,0.8))">&#127903;</div>
      <h2 style="font-size:22px;font-weight:900;color:#fff;margin:0 0 6px">&#1055;&#1088;&#1086;&#1084;&#1086;&#1082;&#1086;&#1076;</h2>
      <p style="font-size:13px;color:rgba(255,255,255,0.4);margin:0">&#1042;&#1074;&#1077;&#1076;&#1080; &#1087;&#1088;&#1086;&#1084;&#1086;&#1082;&#1086;&#1076; &#1095;&#1090;&#1086;&#1073;&#1099; &#1087;&#1086;&#1083;&#1091;&#1095;&#1080;&#1090;&#1100; Stars</p>
    </div>
    <div style="position:relative;margin-bottom:12px">
      <input id="promoInput" type="text" placeholder="&#1042;&#1042;&#1045;&#1044;&#1048; &#1050;&#1054;&#1044;" autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()"
        style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);border:1.5px solid rgba(170,0,255,0.4);border-radius:16px;padding:16px 20px;color:#fff;font-size:18px;font-weight:700;letter-spacing:3px;text-align:center;outline:none"/>
    </div>
    <button onclick="activatePromo()" style="position:relative;overflow:hidden;width:100%;background:linear-gradient(135deg,#aa00ff,#6600cc);border:none;border-radius:16px;padding:16px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(170,0,255,0.4);margin-bottom:12px">
      &#1040;&#1082;&#1090;&#1080;&#1074;&#1080;&#1088;&#1086;&#1074;&#1072;&#1090;&#1100;
    </button>
    <div id="promoResult" style="text-align:center;font-size:14px;font-weight:600;min-height:22px"></div>
  </div>
</div>
</body>
</html>
