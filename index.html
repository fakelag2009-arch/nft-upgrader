<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <title>NFT Upgrader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Весь лейаут — вертикальный flex, body = 100vh -->
<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="#229ED9"/>
        <path d="M17 8l-2 9-3-3-2 2-1-5-3-1 11-3z" fill="white"/>
      </svg>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-right">
      <div class="avatar"><img id="userAvatar" src="https://api.dicebear.com/7.x/thumbs/svg?seed=tg&backgroundColor=1a1a2e" alt="av"/></div>
      <div class="topbar-info">
        <div class="topbar-balance" id="userBalance">0 ⭐</div>
        <button class="topup-btn" onclick="showTopup()">+ Пополнить</button>
      </div>
    </div>
  </header>

  <!-- PAGES — скроллится -->
  <main class="pages">

    <!-- HOME -->
    <section class="page" id="page-home">
      <div class="home-placeholder">
        <div class="home-icon">🎁</div>
        <h2>Главная</h2>
        <p>Скоро здесь появится что-то интересное</p>
        <div class="home-soon">Coming soon</div>
      </div>
    </section>

    <!-- UPGRADE -->
    <section class="page active" id="page-upgrade">
      <div class="page-title"><span class="title-icon">⬆</span> UPGRADE</div>
      <div class="feed-scroll"><div class="feed-track" id="feedTrack"></div></div>
      <div class="roulette-arena">
        <div class="roulette-outer">
          <div class="roulette-ring" id="rouletteRing">
            <canvas id="rouletteCanvas" width="280" height="280"></canvas>
            <div class="roulette-center">
              <span id="centerText">Выберите предмет</span>
              <span id="centerPercent" class="center-percent"></span>
            </div>
            <div class="roulette-needle"></div>
          </div>
        </div>
      </div>
      <div class="slots-row">
        <div class="slot" id="slotYours" onclick="openItemModal('yours')">
          <div class="slot-label">Ваш предмет</div>
          <div class="slot-arrow">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M7 8L12 13L17 8" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M7 13L12 18L17 13" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div class="slot" id="slotWanted" onclick="openItemModal('wanted')">
          <div class="slot-label">Желаемый предмет</div>
          <div class="slot-arrow">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M7 16L12 11L17 16" stroke="#4d9fff" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M7 11L12 6L17 11" stroke="#1a5faa" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="action-bar">
        <button class="action-icon-btn" onclick="resetSlots()">↺</button>
        <button class="upgrade-btn" id="upgradeBtn" onclick="startUpgrade()" disabled>
          <span class="upgrade-btn-text">⬆ Апгрейд</span>
          <span class="upgrade-btn-sub" id="upgradeBtnSub">Шанс выигрыша 0%</span>
        </button>
      </div>

      <!-- Вкладки Инвентарь / Магазин -->
      <div class="inner-tabs">
        <button class="inner-tab active" id="itab-inventory" onclick="switchInnerTab('inventory')">🎒 Инвентарь</button>
        <button class="inner-tab" id="itab-shop" onclick="switchInnerTab('shop')">🛍 Магазин</button>
      </div>

      <div class="inner-panel active" id="ipanel-inventory">
        <div class="inv-empty" id="invEmpty">
          <div style="font-size:40px">📦</div>
          <p>Инвентарь пуст</p>
          <button class="inv-go-shop" onclick="switchInnerTab('shop')">🛍 В магазин</button>
        </div>
        <div class="inv-grid" id="invGrid" style="display:none"></div>
      </div>

      <div class="inner-panel" id="ipanel-shop">
        <div class="shop-tabs">
          <button class="shop-tab active" onclick="setShopTab('all',this)">Все</button>
          <button class="shop-tab" onclick="setShopTab('common',this)">Обычные</button>
          <button class="shop-tab" onclick="setShopTab('uncommon',this)">Необычные</button>
          <button class="shop-tab" onclick="setShopTab('rare',this)">Редкие</button>
          <button class="shop-tab" onclick="setShopTab('legendary',this)">Легенд.</button>
        </div>
        <div class="shop-grid" id="shopGrid"></div>
      </div>

      <div style="height:20px;flex-shrink:0"></div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn" id="nav-home" onclick="switchPage('home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Главная</span>
    </button>
    <button class="nav-btn active" id="nav-upgrade" onclick="switchPage('upgrade')">
      <div class="nav-active-pill"></div>
      <span class="nav-icon nav-upgrade-icon">⬆</span>
      <span class="nav-label">Апгрейд</span>
    </button>
  </nav>

</div>

<!-- TOPUP MODAL -->
<div class="modal-overlay" id="topupModal" onclick="closeTopupOutside(event)">
  <div class="modal topup-modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span>Пополнить баланс</span>
      <button class="modal-close" onclick="closeTopup()">✕</button>
    </div>
    <div class="topup-body">
      <div class="topup-star-display">
        <div class="topup-star-emoji">⭐</div>
        <div class="topup-star-amount" id="topupDisplay">100</div>
        <div class="topup-star-sub">Stars</div>
      </div>
      <div class="topup-chips">
        <button class="topup-chip" onclick="setAmt(1)">1</button>
        <button class="topup-chip" onclick="setAmt(10)">10</button>
        <button class="topup-chip" onclick="setAmt(25)">25</button>
        <button class="topup-chip active" onclick="setAmt(100)">100</button>
        <button class="topup-chip" onclick="setAmt(250)">250</button>
        <button class="topup-chip" onclick="setAmt(500)">500</button>
        <button class="topup-chip" onclick="setAmt(1000)">1000</button>
      </div>
      <div class="topup-input-row">
        <span class="topup-input-star">⭐</span>
        <input type="number" id="topupInput" min="1" max="999999" value="100" placeholder="Введи количество" oninput="onTopupInput(this.value)"/>
      </div>
      <button class="topup-pay-btn" onclick="confirmTopup()">Оплатить <span id="topupPayLabel">100 ⭐</span></button>
      <div class="topup-footer">Оплата через Telegram Stars · Зачисляется мгновенно</div>
    </div>
  </div>
</div>

<!-- ITEM MODAL -->
<div class="modal-overlay" id="itemModal" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span id="modalTitle">Выберите предмет</span>
      <button class="modal-close" onclick="closeItemModal()">✕</button>
    </div>
    <div class="modal-search">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск..." oninput="filterItems()" autocomplete="off"/>
      </div>
    </div>
    <div class="rarity-tabs">
      <button class="rtab active" onclick="setRarityFilter('all',this)">Все</button>
      <button class="rtab" onclick="setRarityFilter('common',this)">Обычные</button>
      <button class="rtab" onclick="setRarityFilter('uncommon',this)">Необычные</button>
      <button class="rtab" onclick="setRarityFilter('rare',this)">Редкие</button>
      <button class="rtab" onclick="setRarityFilter('legendary',this)">Легенд.</button>
    </div>
    <div class="modal-grid" id="itemGrid"></div>
  </div>
</div>

<!-- BUY MODAL -->
<div class="modal-overlay" id="buyModal" onclick="closeBuyModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span>Купить предмет</span>
      <button class="modal-close" onclick="closeBuyModal()">✕</button>
    </div>
    <div class="buy-modal-body" id="buyModalBody"></div>
  </div>
</div>

<!-- RESULT -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-box">
    <div class="result-particles" id="resultParticles"></div>
    <div class="result-glow" id="resultGlow"></div>
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="result-item-card" id="resultItemCard"></div>
    <div class="result-actions">
      <button class="result-btn-secondary" onclick="closeResult()">Закрыть</button>
      <button class="result-btn-primary" onclick="closeResult()">Ещё раз</button>
    </div>
  </div>
</div>

<script src="app.js?v=10"></script>
</body>
</html>
